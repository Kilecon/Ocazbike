name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install API dependencies
        working-directory: da
        run: bun install --frozen-lockfile
      - name: Install SPA dependencies
        working-directory: spa
        run: bun install --frozen-lockfile
      - name: Test API with coverage
        working-directory: da
        run: |
          bun test src --coverage --coverage-reporter=lcov --coverage-dir=coverage
          sed -i 's|^SF:src/|SF:da/src/|' coverage/lcov.info
      - name: Test SPA with coverage
        working-directory: spa
        run: |
          bun test src --coverage --coverage-reporter=lcov --coverage-dir=coverage
          sed -i 's|^SF:src/|SF:spa/src/|' coverage/lcov.info
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=pypduhrhvuuabdsfanyuvjnrbxttpmrvgcjdhsutprrricmpk
            -Dsonar.projectKey=Kilecon_Ocazbike
            -Dsonar.sources=da/src,spa/src
            -Dsonar.javascript.lcov.reportPaths=da/coverage/lcov.info,spa/coverage/lcov.info
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/test/**,**/test-support/**
