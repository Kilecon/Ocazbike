name: Deploy release Ocazbike

on:
  workflow_dispatch:
    inputs:
      skip_trivy:
        description: Skip Trivy image scanning for this run
        type: boolean
        default: false
      deploy_falco:
        description: Deploy Falco after the application
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ocazbike-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to release server
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Require develop
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [ "$DEPLOY_REF" != "refs/heads/develop" ]; then
            echo "::error::Run this workflow from develop only."
            exit 1
          fi

      - name: Check SSH host fingerprint
        env:
          VPS_HOST_FINGERPRINT: ${{ vars.VPS_HOST_FINGERPRINT }}
        run: |
          if [ -z "$VPS_HOST_FINGERPRINT" ]; then
            echo "::error::VPS_HOST_FINGERPRINT must be configured."
            exit 1
          fi

      - name: Checkout deployment scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Build release images
        env:
          SPA_API_URL: ${{ vars.SPA_API_URL }}
          SPA_APP_ID: ${{ vars.SPA_APP_ID || 'my-spa' }}
        run: |
          : "${SPA_API_URL:?Configure SPA_API_URL for the release environment}"
          docker compose --env-file /dev/null -f infra/compose.release.yaml build --pull api spa garage

      - name: Install Trivy
        if: ${{ inputs.skip_trivy == false }}
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      - name: Scan release images
        if: ${{ inputs.skip_trivy == false }}
        run: bash infra/scripts/scan-release-images.sh

      - name: Warn when Trivy is skipped
        if: ${{ inputs.skip_trivy }}
        run: echo "::warning::Trivy image scanning was skipped for this release."

      - name: Publish release images to GHCR
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          tag="sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for service in api spa garage; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$service"
            docker image tag "ocazbike-$service:release" "$image:$tag"
            push_output=$(docker image push "$image:$tag")
            printf '%s\n' "$push_output"
            digest=$(awk -v tag="$tag:" '$1 == tag && $2 == "digest:" { print $3 }' <<< "$push_output")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not determine published digest for $image." >&2
              exit 1
            fi
            printf '%s=%s@%s\n' "$service" "$image" "$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Prepare release secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GARAGE_RPC_SECRET: ${{ secrets.GARAGE_RPC_SECRET }}
          GARAGE_DEFAULT_ACCESS_KEY: ${{ secrets.GARAGE_DEFAULT_ACCESS_KEY }}
          GARAGE_DEFAULT_SECRET_KEY: ${{ secrets.GARAGE_DEFAULT_SECRET_KEY }}
          GRAFANA_USER: ${{ secrets.GRAFANA_USER }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STORE_INFORMATION_INITIAL_DATA: ${{ secrets.STORE_INFORMATION_INITIAL_DATA }}
          SPA_API_URL: ${{ vars.SPA_API_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          SPA_APP_ID: ${{ vars.SPA_APP_ID || 'my-spa' }}
          MAILPIT_UI_PORT: ${{ vars.MAILPIT_UI_PORT || '8025' }}
          COOKIE_SECURE: "true"
        run: bash .github/scripts/prepare-release-secrets.sh

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_DIR: ${{ secrets.VPS_DIR }}
          RELEASE_API_IMAGE: ${{ steps.publish.outputs.api }}
          RELEASE_SPA_IMAGE: ${{ steps.publish.outputs.spa }}
          RELEASE_GARAGE_IMAGE: ${{ steps.publish.outputs.garage }}
          DEPLOY_FALCO: ${{ inputs.deploy_falco }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          fingerprint: ${{ vars.VPS_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA,VPS_DIR,RELEASE_API_IMAGE,RELEASE_SPA_IMAGE,RELEASE_GARAGE_IMAGE,DEPLOY_FALCO,RELEASE_ENV_B64,JWT_SECRET_B64,BOOTSTRAP_ADMIN_PASSWORD_B64,ENCRYPTION_KEY_B64,GARAGE_RPC_SECRET_B64,GARAGE_DEFAULT_ACCESS_KEY_B64,GARAGE_DEFAULT_SECRET_KEY_B64,GRAFANA_USER_B64,GRAFANA_PASSWORD_B64,DISCORD_WEBHOOK_URL_B64,STORE_INFORMATION_INITIAL_DATA_B64
          command_timeout: 25m
          script: |
            set -eu
            : "${RELEASE_API_IMAGE:?Missing published API image}" \
              "${RELEASE_SPA_IMAGE:?Missing published SPA image}" \
              "${RELEASE_GARAGE_IMAGE:?Missing published Garage image}"
            if [ "$(id -u)" != 1002 ] || [ "$(id -g)" != 1002 ]; then
              echo "Unexpected deployment account UID/GID." >&2
              exit 1
            fi
            cd "$VPS_DIR"

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Tracked files have local changes; deployment refused." >&2
              exit 1
            fi

            git fetch origin develop
            git merge-base --is-ancestor "$DEPLOY_SHA" FETCH_HEAD
            manager=$(mktemp)
            trap 'rm -f -- "$manager"' EXIT
            git show "$DEPLOY_SHA:infra/scripts/manage-release.sh" > "$manager"
            bash "$manager" deploy
